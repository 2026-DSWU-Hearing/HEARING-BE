services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hearing
      POSTGRES_PASSWORD: hearing
      POSTGRES_DB: hearing
    ports:
      - "5432:5432"
    volumes:
      - hearing_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  hearing_pg:
